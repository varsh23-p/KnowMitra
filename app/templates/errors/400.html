{% extends "base_public.html" %}
{% block title %}Bad Request{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:2rem;">
  <div style="text-align:center;max-width:480px;">
    <div style="font-size:6rem;font-weight:900;background:var(--grad-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;">400</div>
    <h2 style="margin:.5rem 0;">Bad Request</h2>
    <p style="color:var(--text-muted);margin-bottom:2rem;">The server couldn't understand your request. Please check your input and try again.</p>
    <a href="javascript:history.back()" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Go Back</a>
  </div>
</div>
{% endblock %}

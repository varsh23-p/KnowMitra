{% extends "base_public.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:2rem;">
  <div style="text-align:center;max-width:520px;">
    <div style="font-size:6rem;font-weight:900;background:var(--grad-warm);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;">500</div>
    <h2 style="margin:.5rem 0;">Something Went Wrong</h2>
    <p style="color:var(--text-muted);margin-bottom:2rem;">
      An unexpected error occurred on our end. Our team has been notified.
      Please try again in a moment.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary"><i class="fas fa-home"></i> Go Home</a>
  </div>
</div>
{% endblock %}

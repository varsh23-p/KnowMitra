{% extends "base_public.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:2rem;">
  <div style="text-align:center;max-width:480px;">
    <div style="font-size:6rem;font-weight:900;background:var(--grad-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;">403</div>
    <h2 style="margin:.5rem 0;">Access Denied</h2>
    <p style="color:var(--text-muted);margin-bottom:2rem;">You don't have permission to access this page.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary"><i class="fas fa-home"></i> Go Home</a>
  </div>
</div>
{% endblock %}

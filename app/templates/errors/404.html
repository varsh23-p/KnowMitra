{% extends "base_public.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:2rem;">
  <div style="text-align:center;max-width:520px;">
    <div style="font-size:6rem;font-weight:900;background:var(--grad-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;">404</div>
    <h2 style="margin:.5rem 0;">Page Not Found</h2>
    <p style="color:var(--text-muted);margin-bottom:2rem;">
      The page you're looking for doesn't exist or has been moved.
      Double-check the URL or head back to the dashboard.
    </p>
    <div style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;">
      <a href="{{ url_for('main.index') }}" class="btn btn-primary"><i class="fas fa-home"></i> Home</a>
      <a href="javascript:history.back()" class="btn btn-light"><i class="fas fa-arrow-left"></i> Go Back</a>
    </div>
  </div>
</div>
{% endblock %}

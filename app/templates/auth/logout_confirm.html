{% extends "base.html" %}
{% block title %}Sign Out{% endblock %}
{% block page_title %}Sign Out{% endblock %}

{% block content %}
<div style="max-width:460px;margin:3rem auto;">
  <div class="card" style="text-align:center;">
    <div class="card-body" style="padding:2.5rem 2rem;">
      <div style="width:72px;height:72px;border-radius:50%;background:var(--danger-light);color:var(--danger);
                  display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 1.25rem;">
        <i class="fas fa-sign-out-alt"></i>
      </div>
      <h2 style="margin-bottom:.5rem;">Sign Out?</h2>
      <p style="color:var(--text-muted);margin-bottom:2rem;">
        You will be signed out of your KnowMitra account on this device.
      </p>
      <div style="display:flex;gap:.85rem;justify-content:center;">
        <a href="{{ url_for('dashboard.home') }}" class="btn btn-light">
          <i class="fas fa-arrow-left"></i> Stay Signed In
        </a>
        <form method="POST" action="{{ url_for('auth.logout') }}">
          <button type="submit" class="btn btn-danger">
            <i class="fas fa-sign-out-alt"></i> Yes, Sign Out
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
